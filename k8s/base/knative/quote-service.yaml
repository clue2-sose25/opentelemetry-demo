# Knative Service for the quote tactic: unlike every other component, quote
# is not part of the kubectl-managed Deployment set - it scales to zero and
# is invoked on demand. Requires Knative Serving (+ a networking layer such
# as Kourier) already installed in the cluster; see otel-helm/up.sh for the
# one-time cluster bootstrap this branch was originally developed against.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: quoteservice
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "3"
    spec:
      containers:
      - image: 'ghcr.io/ise-tu-berlin/sustainable-otel/otel-quote:latest'
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_SERVICE_NAME
          value: quote
        - name: OTEL_COLLECTOR_NAME
          value: otel-collector
        - name: QUOTE_PORT
          value: "8080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.otel-demo.svc.cluster.local:4318
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=quote,service.namespace=otel-demo,service.version=2.0.2
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
