# Ingress for the frontend-proxy, the single entrypoint that fronts the
# frontend, Jaeger UI, load-generator UI, and Grafana behind one host.
# Further environment-specific overlays should add a host and TLS
# configuration as needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-proxy
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-proxy
            port:
              number: 8080
