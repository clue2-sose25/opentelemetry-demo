apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: quoteservice
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "3"
    spec:
      containers:
      - image: docker.io/tawalaya/quote-service-knative:latest
        # imagePullPolicy: Never  # Use local image, don't try to pull
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"